name: microshop-test

# Общая ротация docker-логов (важно, чтобы диск не переполнился).
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "5m"
    max-file: "2"

services:
  db:
    logging: *default-logging
    mem_limit: 256m
    cpus: 0.5
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_URL: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: microshop
    volumes:
      - postgres_data:/var/lib/postgresql/
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d microshop"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - server_network

  migrate:
    logging: *default-logging
    mem_limit: 256m
    cpus: 0.5
    build:
      context: .
      dockerfile: ./backend/Dockerfile
    command: ["poetry", "run", "alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:${POSTGRES_PASSWORD}@db:5432/microshop
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    networks:
      - server_network

  web:
    logging: *default-logging
    mem_limit: 256m
    cpus: 0.5
    build:
      context: .
      dockerfile: ./backend/Dockerfile
    command: ["poetry", "run", "uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:${POSTGRES_PASSWORD}@db:5432/microshop
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY is required}
      RABBITMQ_URL: amqp://${RABBITMQ_USER:?RABBITMQ_USER is required}:${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}@rabbitmq:5672/
      UVICORN_RELOAD: "0"
      # Доставка OTP: SMS Aero (осн. канал); Telegram Gateway/бот — опционально.
      SMS_AERO_EMAIL: ${SMS_AERO_EMAIL:-}
      SMS_AERO_API_KEY: ${SMS_AERO_API_KEY:-}
      SMS_AERO_SIGN: ${SMS_AERO_SIGN:-}
      # Web Push (PWA): VAPID-ключи; пока пусто — push выключен.
      # TURN (релей звонков): адреса и общий секрет для временных кредов.
      TURN_URLS: ${TURN_URLS:-}
      TURN_SECRET: ${TURN_SECRET:-}
      TURN_REALM: ${TURN_REALM:-pismo.space}
      TURN_TTL_SECONDS: ${TURN_TTL_SECONDS:-3600}
      WEB_PUSH_VAPID_PUBLIC_KEY: ${WEB_PUSH_VAPID_PUBLIC_KEY:-}
      WEB_PUSH_VAPID_PRIVATE_KEY: ${WEB_PUSH_VAPID_PRIVATE_KEY:-}
      WEB_PUSH_VAPID_SUBJECT: ${WEB_PUSH_VAPID_SUBJECT:-mailto:nyuskov@gmail.com}
      # RuStore Push (Android-приложение): ID проекта и сервисный токен.
      RUSTORE_PUSH_PROJECT_ID: ${RUSTORE_PUSH_PROJECT_ID:-}
      RUSTORE_PUSH_SERVICE_TOKEN: ${RUSTORE_PUSH_SERVICE_TOKEN:-}
      TELEGRAM_GATEWAY_TOKEN: ${TELEGRAM_GATEWAY_TOKEN:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
      TELEGRAM_GATEWAY_BASE_URL: ${TELEGRAM_GATEWAY_BASE_URL:-https://gateway.telegram.org}
      # Суточные лимиты отправки кодов (защита баланса SMS-шлюза).
      AUTH_OTP_DAILY_LIMIT: ${AUTH_OTP_DAILY_LIMIT:-50}
      AUTH_OTP_PER_IP_DAILY_LIMIT: ${AUTH_OTP_PER_IP_DAILY_LIMIT:-20}
      # E-mail-канал (подтверждение адреса, вход по коду, сброс пароля).
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-Pismo}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
      SMTP_SSL: ${SMTP_SSL:-false}
    depends_on:
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    volumes:
      - media_data:/app/media
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).status==200 else 1)"
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    networks:
      - server_network

  rabbitmq:
    logging: *default-logging
    mem_limit: 256m
    cpus: 0.3
    image: rabbitmq:4-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: "+P 1048576"
      VM_MEMORY_HIGH_WATERMARK: "0.4"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5
    networks:
      - server_network

  worker:
    logging: *default-logging
    mem_limit: 256m
    cpus: 0.4
    build:
      context: .
      dockerfile: ./backend/Dockerfile
    command: ["poetry", "run", "celery", "-A", "core.celery_app", "worker", "--loglevel=INFO", "--concurrency=1", "--without-gossip", "--without-mingle", "--without-heartbeat"]
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:${POSTGRES_PASSWORD}@db:5432/microshop
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672/
      # Доставка OTP: SMS Aero (осн.) + Telegram (Gateway/бот) как доп. каналы.
      SMS_AERO_EMAIL: ${SMS_AERO_EMAIL:-}
      SMS_AERO_API_KEY: ${SMS_AERO_API_KEY:-}
      SMS_AERO_SIGN: ${SMS_AERO_SIGN:-}
      # E-mail-канал: письма с кодами отправляет воркер.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-Pismo}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
      SMTP_SSL: ${SMTP_SSL:-false}
      # Web Push (PWA) — отправка в воркере; VAPID-ключи.
      # TURN (релей звонков): адреса и общий секрет для временных кредов.
      TURN_URLS: ${TURN_URLS:-}
      TURN_SECRET: ${TURN_SECRET:-}
      TURN_REALM: ${TURN_REALM:-pismo.space}
      TURN_TTL_SECONDS: ${TURN_TTL_SECONDS:-3600}
      WEB_PUSH_VAPID_PUBLIC_KEY: ${WEB_PUSH_VAPID_PUBLIC_KEY:-}
      WEB_PUSH_VAPID_PRIVATE_KEY: ${WEB_PUSH_VAPID_PRIVATE_KEY:-}
      WEB_PUSH_VAPID_SUBJECT: ${WEB_PUSH_VAPID_SUBJECT:-mailto:nyuskov@gmail.com}
      # RuStore Push (Android-приложение): ID проекта и сервисный токен.
      RUSTORE_PUSH_PROJECT_ID: ${RUSTORE_PUSH_PROJECT_ID:-}
      RUSTORE_PUSH_SERVICE_TOKEN: ${RUSTORE_PUSH_SERVICE_TOKEN:-}
      TELEGRAM_GATEWAY_TOKEN: ${TELEGRAM_GATEWAY_TOKEN:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_GATEWAY_BASE_URL: ${TELEGRAM_GATEWAY_BASE_URL:-https://gateway.telegram.org}
    depends_on:
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    volumes:
      - media_data:/app/media
    restart: unless-stopped
    networks:
      - server_network

  beat:
    logging: *default-logging
    mem_limit: 64m
    cpus: 0.1
    build:
      context: .
      dockerfile: ./backend/Dockerfile
    command: ["poetry", "run", "celery", "-A", "core.celery_app", "beat", "--loglevel=INFO"]
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:${POSTGRES_PASSWORD}@db:5432/microshop
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672/
      # Поллер обычного бота (привязка Telegram) работает в beat.
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - server_network

  frontend:
    logging: *default-logging
    mem_limit: 64m
    cpus: 0.2
    # Образ nginx без статики: файлы приходят из тома frontend_html, который
    # обновляет сервис frontend-dist. Так деплой интерфейса не пересоздаёт
    # контейнер и сайт не пропадает (см. scripts/ci/deploy_remote.sh).
    build:
      context: ./frontend
      dockerfile: Dockerfile.nginx
    ports:
      - "80:80"
      - "443:443" # Открываем порт для входящего HTTPS трафика
    volumes:
      - certbot_etc:/etc/letsencrypt
      - certbot_var:/var/lib/letsencrypt
      - frontend_html:/usr/share/nginx/html
    depends_on:
      - web
    restart: unless-stopped
    networks:
      - server_network

  # Одноразовый сервис: собирает статику и копирует её в том frontend_html.
  # Запускается во время деплоя явно (--profile dist), в обычном `up` не поднимается:
  #   docker compose -p microshop-test -f docker-compose.test.yaml --profile dist \
  #     run --rm --no-deps frontend-dist
  frontend-dist:
    profiles: ["dist"]
    logging: *default-logging
    build:
      context: ./frontend
      dockerfile: Dockerfile.dist
      args:
        VITE_API_ORIGIN: ${VITE_API_ORIGIN:-http://localhost}
    image: microshop-test-frontend-dist:latest
    entrypoint: ["/bin/sh", "-c"]
    # Сначала всё, кроме index.html, потом сам index.html — иначе есть мгновение,
    # когда новый index ссылается на ещё не скопированный ассет.
    # `-mindepth 1` обязателен: без него find отдаёт и сам /src, и cp копирует
    # каталог целиком внутрь /dst (появляется лишний /dst/src).
    command:
      - >
        find /usr/share/nginx/html -mindepth 1 -maxdepth 1 ! -name index.html -exec cp -a {} /dst/ \;
        cp -a /usr/share/nginx/html/index.html /dst/index.html &&
        echo "статика обновлена: $(ls /dst/assets | wc -l) файлов в assets"
    volumes:
      - frontend_html:/dst
    networks:
      - server_network

  # Сервис автоматического перевыпуска SSL-сертификатов (раз в 12 часов)
  certbot:
    image: certbot/certbot:v2.11.0
    restart: unless-stopped
    volumes:
      - certbot_etc:/etc/letsencrypt
      - certbot_var:/var/lib/letsencrypt
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done'"

  # TURN-сервер для WebRTC-звонков за «симметричным» NAT (мобильные операторы).
  # Creds — временные (TURN REST API): общий секрет TURN_SECRET в .env, статического
  # логина/пароля больше нет (TURN_USERNAME/TURN_PASSWORD устарели, их можно убрать).
  # Внешние порты: 3478/udp+tcp, релей 49160-49200/udp; для TURNS — 5349/tcp.
  coturn:
    image: coturn/coturn:4.6
    restart: unless-stopped
    network_mode: host
    command:
      - -n
      - --log-file=stdout
      - --min-port=49160
      - --max-port=49200
      - --realm=${TURN_REALM:-pismo.space}
      # Временные креды (TURN REST API): coturn сам проверяет HMAC-SHA1 от
      # общего секрета и срок из username. Статического пароля нет — значит его
      # нельзя вытащить из клиентского бандла и гонять через релей чужой трафик.
      - --use-auth-secret
      - --static-auth-secret=${TURN_SECRET:?TURN_SECRET is required}
      - --fingerprint
      - --lt-cred-mech
      - --no-cli
      # TLS для TURN включается, когда в файрволе открыт 5349:
      # - --tls-listening-port=5349
      # - --cert=/etc/letsencrypt/live/pismo.space/fullchain.pem
      # - --pkey=/etc/letsencrypt/live/pismo.space/privkey.pem
      - --no-tls
      - --no-dtls
      - --external-ip=176.108.249.9
    volumes:
      # Сертификаты Let's Encrypt — понадобятся, когда включим TURNS (5349).
      - certbot_etc:/etc/letsencrypt:ro

networks:
  server_network:
    driver: bridge

volumes:
  postgres_data:
  # Статика фронтенда: её обновляет frontend-dist, раздаёт frontend.
  frontend_html:
  media_data:
  rabbitmq_data:
  certbot_etc: # Новые тома для постоянного хранения SSL ключей
  certbot_var:
