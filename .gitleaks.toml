# Правила сканера секретов (gitleaks).
#
# Базовая конфигурация — стандартный набор правил gitleaks. Здесь только
# исключения: то, что похоже на секрет, но им не является либо является осознанной
# dev-заглушкой. У каждого исключения — объяснение, чтобы через полгода было
# понятно, почему оно тут.
title = "Pismo"

[allowlist]
description = "Ложные срабатывания и осознанные dev-заглушки"
paths = [
  # Тестовые VAPID-ключи (пара из документации): в тесте проверяется пересоздание
  # push-подписки под новый ключ — настоящего секрета тут нет.
  '''frontend/src/__tests__/callOffline\.spec\.ts''',
  # Примеры токенов в сгенерированных типах и паре исторических мест: значения
  # выдуманные, ни к одному аккаунту не подходят.
  '''frontend/src/types/generated\.ts''',
  '''backend/api_v1/auth/views\.py''',
  # Локальные self-signed сертификаты для HTTPS в разработке. Приватный ключ
  # убран из репозитория (см. .gitignore), но остался в истории — он годится
  # только для localhost, в проде сертификаты выдаёт certbot. Это единственное
  # исключение по путям, которое осталось: широкие маски (docs/, *.md,
  # .env.example) опасны — они скрывали бы и настоящую утечку.
  '''frontend/certs_from_backend/''',
  '''backend/certs/''',
]
