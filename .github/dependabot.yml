# Автоматические обновления зависимостей (Dependabot).

version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  # Python-зависимости бэкенда (pyproject.toml + poetry.lock). Без этого блока
  # FastAPI/SQLAlchemy/Celery и остальные библиотеки обновлялись только руками.
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /frontend
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /nginx
    schedule:
      interval: weekly
