name: CI/CD

on:
  push:
    branches: [main, master, dev]
  pull_request:

jobs:
  backend:
    name: Backend (lint + mypy + tests)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: microshop_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d microshop_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/microshop_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Poetry
        uses: snok/install-poetry@v1

      - name: Cache Poetry virtualenv
        uses: actions/cache@v4
        with:
          path: ~/.cache/pypoetry/virtualenvs
          key: poetry-${{ runner.os }}-${{ hashFiles('backend/poetry.lock') }}

      - name: Install dependencies
        run: poetry install --with dev --no-interaction --no-root

      - name: Apply migrations (alembic)
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/microshop_test
        run: poetry run alembic upgrade head

      - name: Lint (black, isort, flake8)
        run: |
          poetry run black --check .
          poetry run isort --check-only .
          poetry run flake8 . --exclude=.mypy_cache,__pycache__

      - name: Type check (mypy)
        run: poetry run mypy --cache-dir=/tmp/mypy_ci main.py core api_v1

      - name: Tests (pytest, с БД из сервиса)
        run: poetry run pytest -q

  frontend:
    name: Frontend (type-check + lint + unit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - name: Configure pnpm safety
        run: |
          echo "ignore-scripts=false" > frontend/.npmrc
          echo "only-built-dependencies[]=@parcel/watcher" >> frontend/.npmrc
          echo "only-built-dependencies[]=esbuild" >> frontend/.npmrc
          echo "only-built-dependencies[]=vue-demi" >> frontend/.npmrc

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile --prefix frontend

      - name: Type check (vue-tsc)
        run: pnpm --prefix frontend exec vue-tsc --noEmit -p tsconfig.app.json

      - name: Lint (eslint)
        run: pnpm --prefix frontend exec eslint --no-cache src

      - name: Unit tests (vitest)
        run: pnpm --prefix frontend exec vitest run

      - name: Production build (vite)
        env:
          VITE_TELEGRAM_BOT_USERNAME: ${{ secrets.VITE_TELEGRAM_BOT_USERNAME }}
          VITE_API_ORIGIN: https://pismo.space
        run: pnpm --prefix frontend exec vite build


      - name: Upload frontend build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          if-no-files-found: error

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks
        continue-on-error: true
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # АВТОМАТИЧЕСКИЙ ДЕПЛОЙ ПОСЛЕ УСПЕШНЫХ ТЕСТОВ
  deploy:
    name: Deploy to Cloud.ru VM
    runs-on: ubuntu-latest
    needs: [backend, frontend, secrets]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')

    steps:
      - name: Deploy via SSH to Cloud.ru VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -e
            cd ~/microshop
            git pull
            # Используем официальную команду принудительного сброса кэша при сборке
            docker compose -f docker-compose.test.yaml -p microshop-test up -d --build --force-recreate --pull always
            # Явный прогон миграций: при `up -d` одноразовый migrate-сервис может
            # не отработать/не пересоздаться — запускаем его вручную (идемпотентно).
            docker compose -f docker-compose.test.yaml -p microshop-test run --rm migrate
            # Проверка, что схема реально обновилась (иначе деплой считается упавшим).
            # ВНИМАНИЕ: колонка ниже специфична для текущей миграции — при будущих
            # миграциях строку проверки стоит актуализировать.
            docker compose -f docker-compose.test.yaml -p microshop-test exec -T db psql -U postgres -d microshop -tAc \
              "SELECT 1 FROM information_schema.columns WHERE table_name='user' AND column_name='tg_chat_id'" \
              | grep -q 1 \
              || { echo "::error::MIGRATION CHECK FAILED: user.tg_chat_id отсутствует на сервере"; exit 1; }
            echo "::notice::Deploy OK: миграции применены"
            docker system prune -f

