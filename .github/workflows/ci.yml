name: CI/CD

on:
  push:
    branches: [main, master, dev]
    # Правки только документации не должны гонять тесты, сборку образов и
    # выкатку: код в них не меняется.
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - '**/*.md'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - '**/*.md'

# Не допускаем два одновременных прогона для одной ветки: два параллельных
# `docker compose up` на сервере конфликтуют за имена контейнеров (compose
# переименовывает старый контейнер в <id>_<name>, и второй запуск падает с
# «container name is already in use»), а прод остаётся лежать без контейнеров.
# cancel-in-progress: false — начатый деплой доводим до конца, новый ждёт.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  backend:
    name: Backend (lint + mypy + tests)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: microshop_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d microshop_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/microshop_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install Poetry
        uses: snok/install-poetry@v1

      - name: Cache Poetry virtualenv
        uses: actions/cache@v5
        with:
          path: ~/.cache/pypoetry/virtualenvs
          key: poetry-${{ runner.os }}-${{ hashFiles('backend/poetry.lock') }}

      - name: Install dependencies
        run: poetry install --with dev --no-interaction --no-root

      - name: Apply migrations (alembic)
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/microshop_test
        run: poetry run alembic upgrade head

      - name: Lint (black, isort, flake8)
        run: |
          poetry run black --check .
          poetry run isort --check-only .
          poetry run flake8 . --exclude=.mypy_cache,__pycache__

      - name: Type check (mypy)
        run: poetry run mypy --cache-dir=/tmp/mypy_ci main.py core api_v1

      - name: Tests (pytest, с БД из сервиса)
        run: poetry run pytest -q

  frontend:
    name: Frontend (type-check + lint + unit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Set up pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 9
          run_install: false

      - name: Configure pnpm safety
        run: |
          echo "ignore-scripts=false" > frontend/.npmrc
          echo "only-built-dependencies[]=@parcel/watcher" >> frontend/.npmrc
          echo "only-built-dependencies[]=esbuild" >> frontend/.npmrc
          echo "only-built-dependencies[]=vue-demi" >> frontend/.npmrc

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile --prefix frontend

      - name: Type check (vue-tsc)
        run: pnpm --prefix frontend exec vue-tsc --noEmit -p tsconfig.app.json

      - name: Lint (eslint)
        run: pnpm --prefix frontend exec eslint --no-cache src

      # Цвета интерфейса живут только в токенах --ms-*: проверяем, что в стилях
      # компонентов не появилось новых литеральных цветов (светлых пятен в тёмной
      # теме). База уже имеющихся — scripts/style-tokens-baseline.json.
      - name: Styles (нет новых литеральных цветов)
        run: node frontend/scripts/check-tokens.mjs

      # Контраст токенов по WCAG AA: обычный текст 4.5:1, иконки 3:1.
      - name: Styles (контраст токенов)
        run: node frontend/scripts/check-contrast.mjs

      # Слой `html .messenger-shell …` в appearance.css по специфичности сильнее
      # scoped-стилей, поэтому его правило молча перебивает стиль компонента.
      # Проверяем, что таких расхождений (одно свойство — разные значения) нет;
      # база — scripts/style-duplicates-baseline.json.
      - name: Styles (слой не перебивает компоненты)
        run: node frontend/scripts/check-style-duplicates.mjs

      # Радиусы и тени окон/кнопок живут в токенах --ms-*: проверяем, что в стилях
      # компонентов не появилось новых литеральных значений (окна перестают быть
      # похожими друг на друга). База — scripts/style-geometry-baseline.json.
      - name: Styles (нет новой сырой геометрии)
        run: node frontend/scripts/check-geometry.mjs

      - name: Unit tests (vitest)
        run: pnpm --prefix frontend exec vitest run

      - name: Production build (vite)
        env:
          VITE_TELEGRAM_BOT_USERNAME: ${{ secrets.VITE_TELEGRAM_BOT_USERNAME }}
          VITE_API_ORIGIN: https://pismo.space
        run: pnpm --prefix frontend exec vite build

      # Вес приложения — тоже бюджет: остальные проверки стилей вид не трогают,
      # а новый импорт тихо добавляет килобайты. База —
      # scripts/bundle-size-baseline.json, запускать после сборки.
      - name: Bundle size (бюджет gzip)
        run: node frontend/scripts/check-bundle-size.mjs


      - name: Upload frontend build artifact
        uses: actions/upload-artifact@v6
        with:
          name: frontend-dist
          path: frontend/dist
          if-no-files-found: error

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # Версии actions держим на Node 24: раннер GitHub отключил Node 20, и
      # старые мажоры (checkout@v4, gitleaks-action@v2) сыпали предупреждениями.
      #
      # Скан не блокирует деплой: он смотрит историю коммитов, и ложное
      # срабатывание не должно останавливать выпуск (исключения — в
      # `.gitleaks.toml`, конфиг подхватывается сам). Результат виден в
      # аннотациях к запуску.
      - name: Gitleaks
        continue-on-error: true
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # АВТОМАТИЧЕСКИЙ ДЕПЛОЙ ПОСЛЕ УСПЕШНЫХ ТЕСТОВ
  deploy:
    name: Deploy to Cloud.ru VM
    runs-on: ubuntu-latest
    needs: [backend, frontend, secrets]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')

    steps:
      - name: Deploy via SSH to Cloud.ru VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -e
            cd ~/microshop
            # Детерминированный деплой: сервер всегда становится точной копией origin/main.
            # (git pull падал на локальных правках docker-compose.prod.yaml / Dockerfile /
            #  nginx-prod/default.conf — reset --hard исключает такие сбои.)
            git fetch origin
            git reset --hard origin/main
            # Сам деплой живёт в скрипте репозитория: он обновляет только
            # изменившиеся сервисы, следит за health и не пересоздаёт nginx при
            # обновлении одной статики — то есть проходит без простоя.
            sh scripts/ci/deploy_remote.sh
            # Уборка ПОСЛЕ деплоя — но БЕЗ `docker system prune`: он сносит и кеш
            # сборки, а тогда на каждом деплое `poetry install` и `pnpm install`
            # ставятся с нуля (замер на 2 CPU: ~70 с и ~25 с), плюс заново
            # распаковываются сотни мегабайт слоёв. Кеш оставляем, но ограничиваем
            # его объём (замер: полный кеш — около 2.5 ГБ, диск прода 19 ГБ).
            docker container prune -f
            docker image prune -f
            docker builder prune -f --keep-storage 3GB

  # Смоук-тест прод-API: `up -d` завершается успешно и когда внутри всё падает
  # (роутер не собрался, миграция не применилась). Проверяем снаружи, по HTTPS.
  smoke:
    name: Smoke test прод-API
    runs-on: ubuntu-latest
    needs: [deploy]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')

    steps:
      - uses: actions/checkout@v5

      - name: Smoke test (https://pismo.space)
        run: ./scripts/ci/smoke_prod.sh

