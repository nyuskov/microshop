name: CI/CD

on:
  push:
    branches: [main, master, dev]
  pull_request:

# Не допускаем два одновременных прогона для одной ветки: два параллельных
# `docker compose up` на сервере конфликтуют за имена контейнеров (compose
# переименовывает старый контейнер в <id>_<name>, и второй запуск падает с
# «container name is already in use»), а прод остаётся лежать без контейнеров.
# cancel-in-progress: false — начатый деплой доводим до конца, новый ждёт.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  backend:
    name: Backend (lint + mypy + tests)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: microshop_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d microshop_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/microshop_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Poetry
        uses: snok/install-poetry@v1

      - name: Cache Poetry virtualenv
        uses: actions/cache@v4
        with:
          path: ~/.cache/pypoetry/virtualenvs
          key: poetry-${{ runner.os }}-${{ hashFiles('backend/poetry.lock') }}

      - name: Install dependencies
        run: poetry install --with dev --no-interaction --no-root

      - name: Apply migrations (alembic)
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/microshop_test
        run: poetry run alembic upgrade head

      - name: Lint (black, isort, flake8)
        run: |
          poetry run black --check .
          poetry run isort --check-only .
          poetry run flake8 . --exclude=.mypy_cache,__pycache__

      - name: Type check (mypy)
        run: poetry run mypy --cache-dir=/tmp/mypy_ci main.py core api_v1

      - name: Tests (pytest, с БД из сервиса)
        run: poetry run pytest -q

  frontend:
    name: Frontend (type-check + lint + unit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - name: Configure pnpm safety
        run: |
          echo "ignore-scripts=false" > frontend/.npmrc
          echo "only-built-dependencies[]=@parcel/watcher" >> frontend/.npmrc
          echo "only-built-dependencies[]=esbuild" >> frontend/.npmrc
          echo "only-built-dependencies[]=vue-demi" >> frontend/.npmrc

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile --prefix frontend

      - name: Type check (vue-tsc)
        run: pnpm --prefix frontend exec vue-tsc --noEmit -p tsconfig.app.json

      - name: Lint (eslint)
        run: pnpm --prefix frontend exec eslint --no-cache src

      - name: Unit tests (vitest)
        run: pnpm --prefix frontend exec vitest run

      - name: Production build (vite)
        env:
          VITE_TELEGRAM_BOT_USERNAME: ${{ secrets.VITE_TELEGRAM_BOT_USERNAME }}
          VITE_API_ORIGIN: https://pismo.space
        run: pnpm --prefix frontend exec vite build


      - name: Upload frontend build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          if-no-files-found: error

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks
        continue-on-error: true
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # АВТОМАТИЧЕСКИЙ ДЕПЛОЙ ПОСЛЕ УСПЕШНЫХ ТЕСТОВ
  deploy:
    name: Deploy to Cloud.ru VM
    runs-on: ubuntu-latest
    needs: [backend, frontend, secrets]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')

    steps:
      - name: Deploy via SSH to Cloud.ru VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -e
            cd ~/microshop
            # Детерминированный деплой: сервер всегда становится точной копией origin/main.
            # (git pull падал на локальных правках docker-compose.test.yaml / Dockerfile.prod /
            #  nginx.prod.conf — reset --hard исключает такие сбои.)
            git fetch origin
            git reset --hard origin/main
            # Подчищаем контейнеры, оставшиеся от прерванного деплоя: compose
            # переименовывает старый контейнер в <id>_<name>, и без уборки
            # следующий запуск падает на конфликте имён (а прод лежит).
            docker ps -a --format '{{.Names}}' | grep -E '^[0-9a-f]{12}_' | xargs -r docker rm -f || true
            # Используем официальную команду принудительного сброса кэша при сборке
            docker compose -f docker-compose.test.yaml -p microshop-test up -d --build --force-recreate --pull always
            # Явный прогон миграций: при `up -d` одноразовый migrate-сервис может
            # не отработать/не пересоздаться — запускаем его вручную (идемпотентно).
            docker compose -f docker-compose.test.yaml -p microshop-test run --rm migrate
            # Проверка схемы: БД обязана стоять на той же ревизии, что и код в
            # образе (сравниваем `alembic current` с `alembic heads`). Проверка не
            # привязана к конкретной миграции, поэтому не устареет.
            CURRENT_REV=$(docker compose -f docker-compose.test.yaml -p microshop-test exec -T web \
              poetry run alembic current 2>/dev/null | sed -n 's/^\([0-9a-fA-F]\{6,\}\).*/\1/p' | head -1)
            HEAD_REV=$(docker compose -f docker-compose.test.yaml -p microshop-test exec -T web \
              poetry run alembic heads 2>/dev/null | sed -n 's/^\([0-9a-fA-F]\{6,\}\).*/\1/p' | head -1)
            if [ -z "$CURRENT_REV" ] || [ "$CURRENT_REV" != "$HEAD_REV" ]; then
              echo "::error::MIGRATION CHECK FAILED: в БД ревизия '$CURRENT_REV', в коде ожидается '$HEAD_REV'"
              exit 1
            fi
            echo "::notice::Deploy OK: миграции применены (ревизия $CURRENT_REV)"
            docker system prune -f

  # Смоук-тест прод-API: `up -d` завершается успешно и когда внутри всё падает
  # (роутер не собрался, миграция не применилась). Проверяем снаружи, по HTTPS.
  smoke:
    name: Smoke test прод-API
    runs-on: ubuntu-latest
    needs: [deploy]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')

    steps:
      - uses: actions/checkout@v4

      - name: Smoke test (https://pismo.space)
        run: ./scripts/ci/smoke_prod.sh

