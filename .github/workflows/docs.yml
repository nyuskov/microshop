name: Docs

# Ссылки в документации ломает именно правка markdown — а такие коммиты
# основной CI (ci.yml) пропускает целиком (`paths-ignore: **/*.md`), чтобы не
# гонять тесты, сборку образов и деплой ради текста. Поэтому проверка ссылок
# живёт и здесь: тут запускается ТОЛЬКО она, без тестов и выката.
#
# В ci.yml тот же шаг повторяется для коммитов с кодом: он ловит случай, когда
# файл, на который ссылается документация, переименовали или удалили в правке
# без изменений markdown.
on:
  push:
    paths:
      - 'docs/**'
      - '*.md'
      - '**/*.md'
  pull_request:
    paths:
      - 'docs/**'
      - '*.md'
      - '**/*.md'

jobs:
  links:
    name: Docs links (битые локальные ссылки)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Проверить ссылки в README и docs/*.md
        run: node scripts/check-docs-links.mjs
