<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon-180.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Pismo — мессенджер" />
    <meta name="theme-color" content="#5a50e0" />
    <title>Pismo — мессенджер</title>
    <!-- Превью ссылки на сторонних сайтах (Telegram, VK, WhatsApp и т.п.).
         Картинка 1200×630 — из scripts/gen_pismo_og.py → public/og.png.
         Ссылки вида /u/<логин> отдают ту же карточку: приложение их открывает
         (см. resolveProfileLink), а карточка общая — как у большинства сервисов. -->
    <link rel="canonical" href="https://pismo.space/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Pismo" />
    <meta property="og:locale" content="ru_RU" />
    <meta property="og:url" content="https://pismo.space/" />
    <meta property="og:title" content="Pismo — мессенджер" />
    <meta property="og:description" content="Чаты, звонки, истории и обмен файлами — в одном приложении." />
    <meta property="og:image" content="https://pismo.space/og.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Pismo — мессенджер" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Pismo — мессенджер" />
    <meta name="twitter:description" content="Чаты, звонки, истории и обмен файлами — в одном приложении." />
    <meta name="twitter:image" content="https://pismo.space/og.png" />
    <!-- Шрифт Roboto подключён локально (src/assets/fonts.css): внешние запросы
         к Google Fonts не нужны — и быстрее, и работает без них. -->
    <script>
      // Применяем сохранённую тему до первого кадра, чтобы не мигала светлая.
      ;(function () {
        try {
          var root = document.documentElement
          var stored = JSON.parse(localStorage.getItem('appearance') || '{}')
          var mode = stored.mode || null
          if (mode !== 'light' && mode !== 'dark' && mode !== 'system') {
            var legacy = localStorage.getItem('app-theme')
            if (legacy === 'light' || legacy === 'dark') mode = legacy
          }
          if (mode !== 'light' && mode !== 'dark' && mode !== 'system') mode = 'dark'
          var dark =
            mode === 'dark' ||
            (mode === 'system' &&
              window.matchMedia &&
              window.matchMedia('(prefers-color-scheme: dark)').matches)
          root.setAttribute('data-theme', dark ? 'dark' : 'light')
          var accents = {
            green: '#2ea25e',
            blue: '#2f7fd1',
            cyan: '#14a09c',
            violet: '#7c5cd6',
            pink: '#d6579a',
            orange: '#ee7f1d',
            red: '#e04545',
            indigo: '#5a6ee8'
          }
          root.style.setProperty('--ms-accent', accents[stored.accentKey] || '#2ea25e')
          if (stored.bubbleKey) root.setAttribute('data-bubble', stored.bubbleKey)
          var themeColor = document.querySelector('meta[name="theme-color"]')
          if (themeColor)
            themeColor.setAttribute(
              'content',
              dark ? '#10151c' : accents[stored.accentKey] || '#2ea25e'
            )
        } catch (e) {
          /* невалидный localStorage — пропускаем */
        }
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
