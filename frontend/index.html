<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon-180.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Pismo — мессенджер" />
    <meta name="theme-color" content="#5a50e0" />
    <title>Pismo — мессенджер</title>
    <!-- Превью ссылки на сторонних сайтах (Telegram, VK, WhatsApp и т.п.).
         Картинка 1200×630 — из scripts/gen_pismo_og.py → public/og.png.
         Ссылки вида /u/<логин> отдают ту же карточку: приложение их открывает
         (см. resolveProfileLink), а карточка общая — как у большинства сервисов. -->
    <link rel="canonical" href="https://pismo.space/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Pismo" />
    <meta property="og:locale" content="ru_RU" />
    <meta property="og:url" content="https://pismo.space/" />
    <meta property="og:title" content="Pismo — мессенджер" />
    <meta property="og:description" content="Чаты, звонки, истории и обмен файлами — в одном приложении." />
    <meta property="og:image" content="https://pismo.space/og.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Pismo — мессенджер" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Pismo — мессенджер" />
    <meta name="twitter:description" content="Чаты, звонки, истории и обмен файлами — в одном приложении." />
    <meta name="twitter:image" content="https://pismo.space/og.png" />
    <!-- Шрифт Roboto подключён локально (src/assets/fonts.css): внешние запросы
         к Google Fonts не нужны — и быстрее, и работает без них. -->
    <!-- Иконочные шрифты объявлены с `font-display: block`: до их загрузки
         иконки невидимы. Предзагрузка убирает этот провал — файлы всё равно
         нужны для первого экрана (список чатов, панель ввода). -->
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/src/assets/fonts/material-symbols-rounded-subset.woff2"
      crossorigin
    />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/src/assets/fonts/lucide-subset.woff2"
      crossorigin
    />
    <!-- Тема применяется до первого кадра, чтобы не мигала светлая.
         Вынесено из index.html: строгий CSP (script-src 'self') запрещает
         inline-скрипты, а хешировать их руками — лишняя хрупкость. -->
    <script src="/theme-boot.js"></script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
