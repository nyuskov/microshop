# Продовый nginx с автоматическим TLS (Let's Encrypt / Certbot)
# Статика SPA + прокси /api и /media на backend (web:8000).

upstream backend {
    server web:8000;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# HTTP-сервер: перенаправляет все запросы на безопасный HTTPS
server {
    listen 80;
    server_name pismo.space www.pismo.space;

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS-сервер с поддержкой SSL и мессенджера
server {
    listen 443 ssl;
    server_name pismo.space www.pismo.space;

    # Пути к полученным сертификатам Let's Encrypt внутри контейнера
    ssl_certificate /etc/letsencrypt/live/pismo.space/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pismo.space/privkey.pem;

    # Современные настройки безопасности SSL
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 20m;

    # Базовые security-заголовки
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # camera/microphone — разрешаем для этого же сайта (self), иначе запись
    # голоса/видео заблокирована даже при выданном разрешении.
    add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=()" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # SPA-фолбэк
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Хешированные ассеты Vite (js/css в /assets/) — имя содержит хеш, поэтому
    # их можно кэшировать надолго (иммутабельны).
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # index.html (точка входа SPA) всегда отдаём заново, чтобы PWA/браузер
    # сразу видели новые версии после деплоя.
    location = /index.html {
        expires -1;
    }

    # API + WebSocket (звонки/события) с поддержкой SSL
    location /api/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Перезаписываем (а не дополняем) X-Forwarded-For: клиент не должен
        # подменить себе IP, по которому считаются rate-лимиты в бэкенде.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Медиафайлы (сообщения/аватары)
    location /media/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
}
