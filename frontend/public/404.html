<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Страница не найдена — Pismo</title>
    <!-- Панель браузера под текущую схему: экран занимает весь вьюпорт, полоска
         сверху не должна выбиваться из фона. -->
    <meta name="theme-color" content="#0f141b" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#eef1f4" media="(prefers-color-scheme: light)" />
    <!-- Служебная страница: в поиске ей делать нечего. -->
    <meta name="robots" content="noindex" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      /* Полноэкранный экран ошибки: фон, крупный код и текст занимают весь
         вьюпорт, действия — под текстом, подпись — в самом низу. Никакой
         карточки-«окошечка» по центру. Файл самодостаточный (инлайн-CSS, ни
         одного внешнего ресурса).

         ВАЖНО про кнопки: CSP в проде — `script-src 'self'` без
         'unsafe-inline', поэтому inline-скрипты и `javascript:`-ссылки здесь
         НЕ работают. Значит, экран обходится только ссылками: «Открыть Pismo»
         ведёт на `/`, а «Назад» средствами HTML сделать нельзя — вместо неё
         ссылка на поддержку. */
      :root {
        --brand: #6c63ff;
        --brand-2: #3a32c9;
        --bg: #0f141b;
        --text: #e8edf3;
        --muted: #9aa7b4;
        --border: rgba(255, 255, 255, 0.1);
        --code-a: #8b83ff;
        --code-b: #4a42d6;
        --glow: radial-gradient(120% 72% at 50% -18%, rgba(108, 99, 255, 0.24), transparent 62%);
        --dots: radial-gradient(circle at 1px 1px, rgba(150, 170, 190, 0.1) 1px, transparent 0);
      }

      @media (prefers-color-scheme: light) {
        :root {
          --bg: #eef1f4;
          --text: #1d2733;
          --muted: #6b7883;
          --border: rgba(20, 30, 45, 0.12);
          --code-a: #6c63ff;
          --code-b: #3a32c9;
          --glow: radial-gradient(120% 72% at 50% -18%, rgba(108, 99, 255, 0.16), transparent 62%);
          --dots: radial-gradient(circle at 1px 1px, rgba(120, 144, 156, 0.14) 1px, transparent 0);
        }
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        /* dvh, а не vh: на мобильных адресная строка «съедает» низ экрана. */
        min-height: 100dvh;
        margin: 0;
        display: flex;
        flex-direction: column;
        gap: clamp(18px, 4vh, 40px);
        /* Безопасные зоны: вырезы/полоски не должны перекрывать текст. */
        padding: max(clamp(18px, 3vh, 32px), env(safe-area-inset-top)) clamp(16px, 4vw, 56px)
          max(clamp(18px, 3vh, 32px), env(safe-area-inset-bottom));
        background-color: var(--bg);
        /* Мягкое свечение сверху + «обои» в точку, как в чате: экран не выглядит
           пустым даже на большом мониторе. */
        background-image: var(--glow), var(--dots);
        background-repeat: no-repeat, repeat;
        background-size:
          100% 64vh,
          22px 22px;
        color: var(--text);
        font:
          400 16px/1.55 -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          Roboto,
          Ubuntu,
          sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      /* Логотип и название — как в приложении, только в одну строку по центру. */
      .top {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
      }

      .logo {
        display: grid;
        place-items: center;
        width: 34px;
        height: 34px;
        border-radius: 10px;
        background: linear-gradient(160deg, #7b72ff, #3a32c9);
        box-shadow: 0 10px 24px -12px var(--brand);
      }

      .logo svg {
        width: 22px;
        height: 22px;
      }

      .wordmark {
        font-size: 15px;
        font-weight: 600;
        letter-spacing: 0.02em;
      }

      /* Середина экрана: код, заголовок, пояснение, кнопки. */
      .hero {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: clamp(8px, 1.4vh, 14px);
        text-align: center;
        padding: clamp(20px, 5vh, 56px) 0;
      }

      .code {
        margin: 0;
        font-size: clamp(84px, 19vw, 200px);
        font-weight: 800;
        line-height: 0.86;
        letter-spacing: -0.05em;
        color: var(--brand);
      }

      /* Градиентная цифра — только там, где background-clip:text есть:
         иначе текст остался бы прозрачным. */
      @supports (background-clip: text) or (-webkit-background-clip: text) {
        .code {
          background-image: linear-gradient(165deg, var(--code-a), var(--code-b));
          -webkit-background-clip: text;
          background-clip: text;
          color: transparent;
        }
      }

      h1 {
        margin: 0;
        max-width: 24ch;
        font-size: clamp(23px, 3.4vw, 36px);
        font-weight: 700;
        line-height: 1.2;
        letter-spacing: -0.015em;
        text-wrap: balance;
      }

      .lead {
        margin: 0;
        max-width: 46ch;
        color: var(--muted);
        font-size: clamp(15px, 1.5vw, 17px);
        text-wrap: pretty;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        justify-content: center;
        margin-top: clamp(6px, 1.6vh, 16px);
      }

      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 46px;
        padding: 0 22px;
        border: 1px solid var(--border);
        border-radius: 12px;
        background: color-mix(in srgb, var(--text) 6%, transparent);
        color: var(--text);
        font-size: 15px;
        font-weight: 600;
        text-decoration: none;
        transition:
          background 0.18s ease,
          border-color 0.18s ease,
          transform 0.18s ease;
      }

      .btn:hover {
        background: color-mix(in srgb, var(--text) 12%, transparent);
      }

      .btn:active {
        transform: translateY(1px);
      }

      .btn--primary {
        border-color: transparent;
        background: linear-gradient(140deg, var(--brand), var(--brand-2));
        color: #fff;
        box-shadow: 0 16px 32px -16px var(--brand);
      }

      .btn--primary:hover {
        background: linear-gradient(140deg, #7b73ff, #443bd6);
      }

      .btn:focus-visible {
        outline: 2px solid var(--brand);
        outline-offset: 2px;
      }

      /* Подпись внизу экрана, на всю ширину: страница читается как единое целое. */
      .foot {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: center;
        gap: 4px 12px;
        border-top: 1px solid var(--border);
        padding-top: clamp(12px, 2vh, 18px);
        color: var(--muted);
        font-size: 13px;
        text-align: center;
      }

      .foot a {
        color: var(--brand);
        text-decoration: none;
        border-bottom: 1px solid color-mix(in srgb, var(--brand) 45%, transparent);
      }

      .foot a:hover {
        border-bottom-color: var(--brand);
      }

      /* Действия по краям не прижимаем: на телефоне кнопки в одну колонку. */
      @media (max-width: 430px) {
        .actions {
          width: 100%;
        }

        .btn {
          flex: 1 1 100%;
        }
      }

      @media (prefers-reduced-motion: no-preference) {
        .top,
        .hero > *,
        .foot {
          animation: rise 0.5s cubic-bezier(0.2, 0.7, 0.2, 1) backwards;
        }

        .hero > *:nth-child(1) {
          animation-delay: 0.04s;
        }

        .hero > *:nth-child(2) {
          animation-delay: 0.08s;
        }

        .hero > *:nth-child(3) {
          animation-delay: 0.12s;
        }

        .hero > *:nth-child(4) {
          animation-delay: 0.16s;
        }

        @keyframes rise {
          from {
            opacity: 0;
            transform: translateY(12px);
          }
        }
      }
    </style>
  </head>
  <body>
    <header class="top">
      <span class="logo" aria-hidden="true">
        <svg viewBox="0 0 64 64" role="img">
          <g fill="#ffffff">
            <rect x="12.8" y="17.28" width="38.4" height="29.44" rx="7.65" />
            <path d="M19.33 46.13 L12.03 52.9 L26.62 46.43 Z" />
          </g>
          <path
            d="M17.02 21.7 L32 29.94 L46.98 21.7"
            fill="none"
            stroke="#3a32c9"
            stroke-width="2.6"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
      </span>
      <span class="wordmark">Pismo</span>
    </header>

    <main class="hero">
      <p class="code">404</p>
      <h1>Страница не найдена</h1>
      <p class="lead">
        Возможно, ссылка устарела, чат удалён или в адресе опечатка. Проверьте адрес или вернитесь в
        приложение.
      </p>
      <div class="actions">
        <a class="btn btn--primary" href="/">Открыть Pismo</a>
      </div>
    </main>

    <footer class="foot">
      <span>Кажется, это ошибка приложения?</span>
      <a href="mailto:nyuskov@gmail.com">nyuskov@gmail.com</a>
    </footer>
  </body>
</html>
