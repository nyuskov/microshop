<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Страница не найдена — Pismo</title>
    <meta name="theme-color" content="#10151c" />
    <!-- Служебная страница: в поиске ей делать нечего. -->
    <meta name="robots" content="noindex" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      :root {
        --brand: #6c63ff;
        --bg: #10151c;
        --surface: #182029;
        --border: #24303c;
        --text: #e8edf3;
        --muted: #9aa7b4;
      }
      @media (prefers-color-scheme: light) {
        :root {
          --bg: #eef1f4;
          --surface: #ffffff;
          --border: #e2e6ea;
          --text: #1d2733;
          --muted: #6b7883;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px 16px;
        background: var(--bg);
        color: var(--text);
        font:
          16px/1.6 -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          Roboto,
          Ubuntu,
          sans-serif;
      }
      main {
        width: 100%;
        max-width: 520px;
        text-align: center;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 18px;
        padding: 36px 28px 32px;
        box-shadow: 0 18px 50px rgba(0, 0, 0, 0.18);
      }
      .brand {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 56px;
        height: 56px;
        border-radius: 16px;
        background: linear-gradient(135deg, var(--brand), #4a42d6);
        margin-bottom: 18px;
      }
      .brand svg {
        width: 28px;
        height: 28px;
        fill: #fff;
      }
      .code {
        margin: 0;
        font-size: 56px;
        font-weight: 700;
        line-height: 1;
        letter-spacing: 2px;
        color: var(--brand);
      }
      h1 {
        margin: 12px 0 8px;
        font-size: 22px;
        line-height: 1.3;
      }
      p {
        margin: 0 0 22px;
        color: var(--muted);
        font-size: 15px;
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        justify-content: center;
      }
      a.button {
        display: inline-block;
        padding: 12px 22px;
        border-radius: 12px;
        background: var(--brand);
        color: #fff;
        font-size: 15px;
        font-weight: 600;
        text-decoration: none;
      }
      a.button.secondary {
        background: transparent;
        color: var(--text);
        border: 1px solid var(--border);
      }
      a.button:hover {
        filter: brightness(1.06);
      }
      .hint {
        margin: 22px 0 0;
        font-size: 13px;
        color: var(--muted);
      }
      .hint a {
        color: var(--brand);
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <span class="brand" aria-hidden="true">
        <svg viewBox="0 0 24 24" role="img">
          <path
            d="M12 3C6.9 3 2.8 6.6 2.8 11c0 2.5 1.4 4.7 3.6 6.2-.2.9-.7 2-1.6 3 1.9-.2 3.4-.9 4.5-1.6.9.2 1.8.3 2.7.3 5.1 0 9.2-3.6 9.2-8S17.1 3 12 3Z"
          />
        </svg>
      </span>
      <p class="code">404</p>
      <h1>Страница не найдена</h1>
      <p>
        Возможно, ссылка устарела, чат удалён или в адресе опечатка. Проверьте адрес или вернитесь в
        приложение.
      </p>
      <div class="actions">
        <a class="button" href="/">Открыть Pismo</a>
        <a class="button secondary" href="javascript:history.back()">Назад</a>
      </div>
      <p class="hint">
        Кажется, это ошибка приложения? Напишите на
        <a href="mailto:nyuskov@gmail.com">nyuskov@gmail.com</a>.
      </p>
    </main>
  </body>
</html>
