# Продовый nginx с автоматическим TLS (Let's Encrypt / Certbot)
# Статика SPA + прокси /api и /media на бэкенд.
#
# Файл лежит в каталоге, который монтируется в контейнер
# (`./frontend/nginx-prod:/etc/nginx/conf.d:ro` в docker-compose.test.yaml):
# правки конфига применяются командой `nginx -s reload` без пересоздания
# контейнера, то есть без простоя.

# DNS docker'а: нужен для `resolve` в upstream — nginx перечитывает адреса
# слотов и перестаёт слать запросы остановленному слоту за пару секунд, а не
# до перезапуска nginx.
resolver 127.0.0.11 valid=2s ipv6=off;

# Синий/зелёный деплой бэкенда: два слота, из которых в работе обычно один.
# Деплой поднимает свободный слот на новом образе, дожидается у него health и
# только потом гасит прежний — запросы всё время есть кому обработать
# (см. scripts/ci/deploy_remote.sh).
# `resolve` (nginx ≥ 1.27.3) — адреса берутся из DNS в рантайме, поэтому слот
# может быть не запущен: ошибки при разборе конфига не будет.
upstream backend {
    zone backend 64k;
    server web-blue:8000 resolve max_fails=2 fail_timeout=5s;
    server web-green:8000 resolve max_fails=2 fail_timeout=5s;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# HTTP-сервер: перенаправляет все запросы на безопасный HTTPS
server {
    listen 80;
    server_name pismo.space www.pismo.space;

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS-сервер с поддержкой SSL и мессенджера
server {
    listen 443 ssl;
    server_name pismo.space www.pismo.space;

    # Пути к полученным сертификатам Let's Encrypt внутри контейнера
    ssl_certificate /etc/letsencrypt/live/pismo.space/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pismo.space/privkey.pem;

    # Современные настройки безопасности SSL
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 20m;

    # Базовые security-заголовки
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Полгода HSTS: браузер сам переходит на https, перехватить первый запрос
    # по http нельзя. Без includeSubDomains — поддомены (если появятся) не
    # ломаются, пока у них нет сертификата.
    add_header Strict-Transport-Security "max-age=15552000" always;
    # camera/microphone — разрешаем для этого же сайта (self), иначе запись
    # голоса/видео заблокирована даже при выданном разрешении.
    add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=()" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # SPA-фолбэк
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Хешированные ассеты Vite (js/css в /assets/) — имя содержит хеш, поэтому
    # их можно кэшировать надолго (иммутабельны).
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # index.html (точка входа SPA) всегда отдаём заново, чтобы PWA/браузер
    # сразу видели новые версии после деплоя.
    location = /index.html {
        expires -1;
    }

    # API + WebSocket (звонки/события) с поддержкой SSL
    location /api/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        # Если слот ответить не смог (его как раз остановили), пробуем второй:
        # запрос до приложения не дошёл, поэтому повтор безопасен даже для POST.
        # non_idempotent здесь НЕ включаем: повторять запрос, который мог дойти,
        # нельзя — иначе возможны дубли сообщений.
        proxy_next_upstream error timeout http_502 http_504;
        # Уже остановленный контейнер не отвечает — пакеты просто теряются.
        # Без короткого таймаута nginx ждёт минуту и запрос висит; с ним через
        # 5 с запрос уходит на живой слот.
        proxy_connect_timeout 5s;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Перезаписываем (а не дополняем) X-Forwarded-For: клиент не должен
        # подменить себе IP, по которому считаются rate-лимиты в бэкенде.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Медиафайлы (сообщения/аватары)
    location /media/ {
        proxy_pass http://backend;
        proxy_next_upstream error timeout http_502 http_504;
        proxy_connect_timeout 5s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=15552000" always;
    }
}
