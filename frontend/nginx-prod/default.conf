# Продовый nginx с автоматическим TLS (Let's Encrypt / Certbot)
# Статика SPA + прокси /api и /media на бэкенд.
#
# Файл лежит в каталоге, который монтируется в контейнер
# (`./frontend/nginx-prod:/etc/nginx/conf.d:ro` в docker-compose.prod.yaml):
# правки конфига применяются командой `nginx -s reload` без пересоздания
# контейнера, то есть без простоя.

# DNS docker'а: нужен для `resolve` в upstream — nginx перечитывает адреса
# слотов и перестаёт слать запросы остановленному слоту за пару секунд, а не
# до перезапуска nginx.
resolver 127.0.0.11 valid=2s ipv6=off;

# Синий/зелёный деплой бэкенда: два слота, из которых в работе обычно один.
# Деплой поднимает свободный слот на новом образе, дожидается у него health и
# только потом гасит прежний — запросы всё время есть кому обработать
# (см. scripts/ci/deploy_remote.sh).
# `resolve` (nginx ≥ 1.27.3) — адреса берутся из DNS в рантайме, поэтому слот
# может быть не запущен: ошибки при разборе конфига не будет.
upstream backend {
    zone backend 64k;
    server web-blue:8000 resolve max_fails=2 fail_timeout=5s;
    server web-green:8000 resolve max_fails=2 fail_timeout=5s;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# HTTP-сервер: перенаправляет все запросы на безопасный HTTPS
server {
    listen 80;
    server_name pismo.space www.pismo.space;

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS-сервер с поддержкой SSL и мессенджера
server {
    listen 443 ssl;
    # HTTP/2 (директива доступна с nginx 1.25.1, на проде 1.27.5).
    # Даёт мультиплексирование: несколько запросов идут в одном соединении,
    # поэтому потери пакетов в туннеле (VPN/мобильная сеть) ощущаются слабее —
    # это не требует отдельного TLS-рукопожатия на каждый ресурс.
    # HTTP/1.1 остаётся как фолбэк для старых клиентов (ALPN).
    http2 on;
    server_name pismo.space www.pismo.space;

    # Пути к полученным сертификатам Let's Encrypt внутри контейнера
    ssl_certificate /etc/letsencrypt/live/pismo.space/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pismo.space/privkey.pem;

    # Современные настройки безопасности SSL
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 20m;

    # Базовые security-заголовки
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Полгода HSTS: браузер сам переходит на https, перехватить первый запрос
    # по http нельзя. Без includeSubDomains — поддомены (если появятся) не
    # ломаются, пока у них нет сертификата.
    add_header Strict-Transport-Security "max-age=15552000" always;
    # camera/microphone — разрешаем для этого же сайта (self), иначе запись
    # голоса/видео заблокирована даже при выданном разрешении.
    add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=()" always;

    # CSP: что страница может загружать и куда ей можно обращаться.
    # `script-src 'self'` — inline-скриптов нет (тема вынесена в
    # /theme-boot.js), поэтому XSS-инъекция скрипта не выполнится.
    # `'wasm-unsafe-eval'` нужен распознаванию речи: расшифровка идёт моделью
    # прямо в браузере (WebAssembly, onnxruntime-web), а без этого разрешения
    # Chrome отказывается компилировать модуль и кнопка «в текст» падает.
    # `style-src ... 'unsafe-inline'` нужен динамическим стилям Quasar/Vue.
    # img/media — свои файлы + blob: (расшифрованные вложения E2EE) и GIF
    # из Giphy; connect — свой API, WebSocket и Giphy API. Внешних CDN здесь нет
    # намеренно: движок распознавания, его рантайм и модели отдаёт наш сервер
    # из /stt/ (см. docs/on-device-transcription.md).
    # `worker-src ... blob:` — onnxruntime-web поднимает свой рабочий поток из
    # blob-ссылки, когда браузер умеет потоки.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data: https://*.giphy.com; media-src 'self' blob: data:; font-src 'self' data:; connect-src 'self' wss: https://api.giphy.com; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    # Уровень сжатия по умолчанию — 1: процессор экономится, но байт уходит на
    # 15–20 % больше. Основной чанк — сотни килобайт, и на слабом телефоне в
    # мобильной сети разница заметна (замер 24.09.2026: index.js 191 КБ на
    # уровне 1 против ~162 КБ на уровне 9, то есть уровень 6 экономит ~25 КБ
    # только на нём). gzip_static здесь не помощник: .gz-файлы в сборку не
    # кладутся (их не создаёт vite build).
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;

    # SPA-фолбэк
    location / {
        try_files $uri $uri/ /index.html;
        # Ошибка отдачи статики (нет index.html в томе и т. п.) — показываем
        # понятную страницу. Для /api/ и /media/ это не срабатывает: nginx не
        # перехватывает ответы прокси (proxy_intercept_errors выключен), поэтому
        # JSON-ошибки бэкенда уходят клиенту как есть.
        error_page 500 502 503 504 =500 /500.html;
    }

    # Статические экраны ошибок: та же палитра, что у приложения, без внешних
    # ресурсов — их отдаёт сам nginx, поэтому они видны даже когда фронтенд или
    # бэкенд недоступны. Кэш отключён (страница служебная), индексировать её
    # незачем.
    location = /404.html {
        add_header Cache-Control "no-store" always;
        add_header X-Robots-Tag "noindex" always;
    }

    location = /500.html {
        add_header Cache-Control "no-store" always;
        add_header X-Robots-Tag "noindex" always;
    }

    # Нет файла/ассета → страница 404 (статус оставляем 404, чтобы клиенты и
    # мониторинг видели реальный код, а не "200 с текстом ошибки").
    error_page 404 =404 /404.html;

    # Хешированные ассеты Vite (js/css в /assets/) — имя содержит хеш, поэтому
    # их можно кэшировать надолго (иммутабельны).
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # Ассеты распознавания речи на устройстве: движок (transformers.js), рантайм
    # onnxruntime-web и модели Whisper. Лежат отдельным каталогом на хосте
    # (монтируется в docker-compose.prod.yaml), потому что весят ~140 МБ и не
    # являются частью сборки интерфейса. Кэш длинный: имена файлов постоянные, а
    # модели и движок меняются вместе с версией, которую называет manifest.json.
    # `try_files $uri =404` обязателен: без него SPA-фолбэк вернул бы на
    # отсутствующий файл страницу с кодом 200, и браузер получил бы HTML вместо
    # скрипта (движок при этом «успешно» загрузился бы и упал на разборе).
    location /stt/ {
        # Типы перечисляем явно. Блок `types` внутри location ЗАМЕНЯЕТ
        # унаследованный набор из mime.types, а не дополняет его, поэтому здесь
        # перечислены все виды файлов, которые лежат в каталоге. Отдельно нужен
        # `.mjs`: nginx его не знает и отдаёт как octet-stream, а браузер
        # отказывается выполнять модуль с чужим типом («Expected a JavaScript
        # module script»), и движок не поднимается.
        types {
            text/javascript js mjs;
            application/json json;
            application/wasm wasm;
            application/octet-stream onnx;
        }
        expires 7d;
        try_files $uri =404;
    }

    # index.html (точка входа SPA) всегда отдаём заново, чтобы PWA/браузер
    # сразу видели новые версии после деплоя.
    location = /index.html {
        expires -1;
    }

    # Service worker: браузер обязан проверять его каждый раз, иначе PWA
    # останется на старом коде и старом обработчике push (аватар и т.п.).
    location = /sw.js {
        expires -1;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # API + WebSocket (звонки/события) с поддержкой SSL
    location /api/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        # Если слот ответить не смог (его как раз остановили), пробуем второй:
        # запрос до приложения не дошёл, поэтому повтор безопасен даже для POST.
        # non_idempotent здесь НЕ включаем: повторять запрос, который мог дойти,
        # нельзя — иначе возможны дубли сообщений.
        proxy_next_upstream error timeout http_502 http_504;
        # Уже остановленный контейнер не отвечает — пакеты просто теряются.
        # Без короткого таймаута nginx ждёт минуту и запрос висит; с ним через
        # 5 с запрос уходит на живой слот.
        proxy_connect_timeout 5s;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Перезаписываем (а не дополняем) X-Forwarded-For: клиент не должен
        # подменить себе IP, по которому считаются rate-лимиты в бэкенде.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Медиафайлы (сообщения/аватары). Отдаёт их приложение, а не nginx: на диске
    # файлы лежат зашифрованными (core/media_crypto.py), и расшифровать их умеет
    # только бэкенд — он же обслуживает Range-запросы (перемотка видео).
    location /media/ {
        proxy_pass http://backend;
        proxy_next_upstream error timeout http_502 http_504;
        proxy_connect_timeout 5s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Ответ идёт потоком: если nginx начнёт буферизовать его на диск, то
        # расшифрованные медиа окажутся во временных файлах контейнера — и
        # шифрование «в покое» потеряет смысл. Буфер (в том числе дисковый)
        # выключаем: файлы отдаются кусками, память не растёт.
        proxy_buffering off;
        proxy_max_temp_file_size 0;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=15552000" always;
        # Медиа отдаём статикой (URL содержит uuid), поэтому CSP здесь не нужен.
    }
}
