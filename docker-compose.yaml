# docker-compose.yml

# Общая ротация docker-логов (json-file не растёт бесконечно).
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  web:
    logging: *default-logging
    build:
      context: .
      dockerfile: ./backend/Dockerfile
    develop:
      watch:
        - path: ./backend
          action: sync
          target: /app
          ignore:
            - .git/
    ports:
      - 8000:8000
    environment:
      # Значения берутся из корневого .env (см. .env.example). Если файла нет — compose
      # остановится с понятной ошибкой, а не подставит захардкоженный пароль.
      - DATABASE_URL=postgresql+asyncpg://postgres:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required (see .env.example)}@db:5432/microshop
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:?JWT_SECRET_KEY is required (see .env.example)}
      - REGISTRATION_ENABLED=${REGISTRATION_ENABLED:-true}
      - RABBITMQ_URL=amqp://${RABBITMQ_USER:?RABBITMQ_USER is required (see .env.example)}:${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required (see .env.example)}@rabbitmq:5672/
      # Метрики для Prometheus: секрет доступа к /api/v1/system/metrics/
      # (пусто — эндпоинта как будто нет, 404).
      - METRICS_TOKEN=${METRICS_TOKEN:-}
      # Доставка OTP: SMS Aero (осн., значения из .env) + Telegram (опционально).
      - SMS_AERO_EMAIL=${SMS_AERO_EMAIL:-}
      - SMS_AERO_API_KEY=${SMS_AERO_API_KEY:-}
      - SMS_AERO_SIGN=${SMS_AERO_SIGN:-}
      - TELEGRAM_GATEWAY_TOKEN=${TELEGRAM_GATEWAY_TOKEN:-}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_BOT_USERNAME=${TELEGRAM_BOT_USERNAME:-}
      # Суточные лимиты отправки кодов (защита баланса SMS-шлюза).
      - AUTH_OTP_DAILY_LIMIT=${AUTH_OTP_DAILY_LIMIT:-50}
      - AUTH_OTP_PER_IP_DAILY_LIMIT=${AUTH_OTP_PER_IP_DAILY_LIMIT:-20}
      # E-mail-канал (подтверждение адреса, вход по коду, сброс пароля).
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM=${SMTP_FROM:-}
      - SMTP_FROM_NAME=${SMTP_FROM_NAME:-Pismo}
      - SMTP_STARTTLS=${SMTP_STARTTLS:-true}
      - SMTP_SSL=${SMTP_SSL:-false}
      # Куда писать служебные письма (отчёты о падении приложения).
      - ALERT_EMAIL=${ALERT_EMAIL:-nyuskov@gmail.com}
      # Шифрование данных «в покое» (тексты сообщений): ключ 32 байта (hex/base64).
      # Пусто — выключено (данные пишутся и читаются как раньше).
      - AT_REST_KEY=${AT_REST_KEY:-}
      # Прошлый ключ (ротация ключа at-rest): читаем им, пока история
      # не перешифрована. Порядок — docs/at-rest-rotation.md.
      - AT_REST_KEY_PREVIOUS=${AT_REST_KEY_PREVIOUS:-}
      # Web Push (PWA): VAPID-ключи; пока пусто — push выключен.
      - WEB_PUSH_VAPID_PUBLIC_KEY=${WEB_PUSH_VAPID_PUBLIC_KEY:-}
      - WEB_PUSH_VAPID_PRIVATE_KEY=${WEB_PUSH_VAPID_PRIVATE_KEY:-}
      - WEB_PUSH_VAPID_SUBJECT=${WEB_PUSH_VAPID_SUBJECT:-mailto:nyuskov@gmail.com}
      # RuStore Push (Android-приложение): ID проекта и сервисный токен.
      - RUSTORE_PUSH_PROJECT_ID=${RUSTORE_PUSH_PROJECT_ID:-}
      - RUSTORE_PUSH_SERVICE_TOKEN=${RUSTORE_PUSH_SERVICE_TOKEN:-}
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - server_network
    # Монтируем исходный код backend внутрь контейнера
    volumes:
      - ./backend:/app

  # Очередь/брокер для фоновых задач (Celery) и моста realtime-событий.
  rabbitmq:
    logging: *default-logging
    image: rabbitmq:4-management
    ports:
      # Management UI (для отладки). Внутренние подключения — только по сети.
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?RABBITMQ_USER is required (see .env.example)}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required (see .env.example)}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 20s
    networks:
      - server_network

  # Воркер фоновых задач Celery (тот же образ backend, общий код/media).
  worker:
    logging: *default-logging
    build:
      context: .
      dockerfile: ./backend/Dockerfile
    command: ["poetry", "run", "celery", "-A", "core.celery_app", "worker", "--loglevel=INFO", "--without-gossip", "--without-mingle", "--without-heartbeat"]
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required (see .env.example)}@db:5432/microshop
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:?JWT_SECRET_KEY is required (see .env.example)}
      - RABBITMQ_URL=amqp://${RABBITMQ_USER:?RABBITMQ_USER is required (see .env.example)}:${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required (see .env.example)}@rabbitmq:5672/
      # Доставка OTP (работу делает воркер): SMS Aero + Telegram (опционально).
      - SMS_AERO_EMAIL=${SMS_AERO_EMAIL:-}
      - SMS_AERO_API_KEY=${SMS_AERO_API_KEY:-}
      - SMS_AERO_SIGN=${SMS_AERO_SIGN:-}
      # E-mail-канал: письма с кодами отправляет воркер.
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM=${SMTP_FROM:-}
      - SMTP_FROM_NAME=${SMTP_FROM_NAME:-Pismo}
      - SMTP_STARTTLS=${SMTP_STARTTLS:-true}
      - SMTP_SSL=${SMTP_SSL:-false}
      # Отчёты о падении приложения отправляет воркер — адрес нужен и ему.
      - ALERT_EMAIL=${ALERT_EMAIL:-nyuskov@gmail.com}
      - TELEGRAM_GATEWAY_TOKEN=${TELEGRAM_GATEWAY_TOKEN:-}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_BOT_USERNAME=${TELEGRAM_BOT_USERNAME:-}
      # Шифрование «в покое»: ключ нужен и воркеру — он собирает текст для push.
      - AT_REST_KEY=${AT_REST_KEY:-}
      # Прошлый ключ (ротация): воркер тоже читает историю (push, GIF).
      - AT_REST_KEY_PREVIOUS=${AT_REST_KEY_PREVIOUS:-}
      # Web Push (PWA): отправка в воркере; VAPID-ключи.
      - WEB_PUSH_VAPID_PUBLIC_KEY=${WEB_PUSH_VAPID_PUBLIC_KEY:-}
      - WEB_PUSH_VAPID_PRIVATE_KEY=${WEB_PUSH_VAPID_PRIVATE_KEY:-}
      - WEB_PUSH_VAPID_SUBJECT=${WEB_PUSH_VAPID_SUBJECT:-mailto:nyuskov@gmail.com}
      # RuStore Push (Android-приложение): ID проекта и сервисный токен.
      - RUSTORE_PUSH_PROJECT_ID=${RUSTORE_PUSH_PROJECT_ID:-}
      - RUSTORE_PUSH_SERVICE_TOKEN=${RUSTORE_PUSH_SERVICE_TOKEN:-}
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - server_network
    volumes:
      - ./backend:/app
    develop:
      watch:
        - path: ./backend
          action: sync
          target: /app
          ignore:
            - .git/

  # Планировщик периодических задач (celery beat) — например, очистка media.
  beat:
    logging: *default-logging
    build:
      context: .
      dockerfile: ./backend/Dockerfile
    command: ["poetry", "run", "celery", "-A", "core.celery_app", "beat", "--loglevel=INFO"]
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required (see .env.example)}@db:5432/microshop
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:?JWT_SECRET_KEY is required (see .env.example)}
      - RABBITMQ_URL=amqp://${RABBITMQ_USER:?RABBITMQ_USER is required (see .env.example)}:${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required (see .env.example)}@rabbitmq:5672/
      # Поллер привязки Telegram (работу делает beat).
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_BOT_USERNAME=${TELEGRAM_BOT_USERNAME:-}
      # false — опрос выключен целиком: задачи нет в расписании beat (нужно там,
      # где до api.telegram.org нет маршрута, иначе пустой тик каждые 5 секунд).
      - TELEGRAM_POLL_ENABLED=${TELEGRAM_POLL_ENABLED:-true}
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - server_network
    volumes:
      - ./backend:/app
    develop:
      watch:
        - path: ./backend
          action: sync
          target: /app
          ignore:
            - .git/

  db:
    logging: *default-logging
    image: postgres:18
    volumes:
        - postgres_data:/var/lib/postgresql/
        # Дамп/восстановление: когда volume БД создаётся заново (после down -v),
        # postgres автоматически выполнит ./db_dump/*.sql (восстановление из дампа).
        # Свежий дамп снимите скриптом ./scripts/db/dump_db.sh (или он вызывается в
        # scripts/dev/entry.sh).
        - ./db_dump:/docker-entrypoint-initdb.d:ro
    environment:
        - POSTGRES_URL=postgres
        - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required (see .env.example)}
        - POSTGRES_DB=microshop
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d microshop"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - server_network

  # НОВЫЙ СЕРВИС FRONTEND
  frontend:
    logging: *default-logging
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    volumes:
      # Монтируем исходный код frontend внутрь контейнера
      - ./frontend:/app
      # Монтируем папку с сертификатами из backend внутрь контейнера в /app/certs_from_backend
      - ./backend/certs:/app/certs_from_backend:ro
      # Не монтируем node_modules из хоста, он будет внутри контейнера
    ports:
      # Открываем порт vite для отладки, если нужно. Важно: vite должен слушать 0.0.0.0
      - "5173:5173"
    networks:
      - server_network
    # Возможность наблюдать за изменениями в исходниках и перезапускать контейнер или синхронизировать файлы
    # зависит от реализации в Dockerfile.dev (npm run dev -- --host уже там)
    develop:
      watch:
        - path: ./frontend
          action: sync
          target: /app
          ignore:
            - node_modules/
            - dist/
            - .git/


  nginx:
    logging: *default-logging
    image: nginx:1.27-alpine
    build:
      context: .
      dockerfile: ./nginx/Dockerfile # Этот файл копирует dev.conf как default.conf
    ports:
      - 8080:80
    volumes:
      # УБИРАЕМ монтирование dist, так как frontend обслуживается отдельным контейнером
      # - ./frontend/dist:/usr/share/nginx/html:ro
      # Монтируем dev.conf как default.conf, чтобы он использовался как основная конфигурация
      # Это переопределяет копирование из Dockerfile, если нужно использовать compose для dev.
      - ./nginx/dev.conf:/etc/nginx/conf.d/default.conf:ro
      # Можно также смонтировать conf.d, если нужно часто менять конфиг
      # - ./nginx/conf.d:/etc/nginx/conf.d
    depends_on:
      - web
      - frontend # Теперь зависит и от frontend
    networks:
      - server_network
    # Убираем watch для nginx, так как конфиг меняется редко в dev, и мы используем volume mount
    # develop:
    #   watch:
    #     - path: ./nginx/dev.conf
    #       action: rebuild
    #       target: /etc/nginx/conf.d/default.conf

networks:
  server_network:
    driver: bridge
volumes:
  postgres_data: