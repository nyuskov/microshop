[tool.poetry]
name = "backend"
version = "0.1.0"
description = ""
authors = ["Your Name <you@example.com>"]

[tool.poetry.dependencies]
python = "^3.13"
fastapi = "^0.115.6"
uvicorn = {extras = ["standard"], version = "^0.32.1"}
sqlalchemy = {extras = ["asyncio"], version = "^2.0.36"}
asyncpg = "^0.30.0"
alembic = "^1.16.5"
# Удаляем fastapi-users, passlib, bcrypt
# fastapi-users = {extras = ["sqlalchemy"], version = "^14.0.1"}
# passlib = {extras = ["bcrypt"], version = "^1.7.4"}
# bcrypt = "3.2.0"
# Добавляем pwdlib с поддержкой argon2
pwdlib = {extras = ["argon2"], version = "^0.3.0"}
fastapi-users = {extras = ["sqlalchemy"], version = "^15.0.0"}
pydantic-settings = "^2.0.0"
pyjwt = "^2.13.0"
celery = "^5.5.0"
aio-pika = "^9.5.0"
pywebpush = "^2.5.0"
pillow = "^12.3.0"
# HEIC/HEIF → JPEG: Samsung и iPhone снимают в HEIC, а браузеры его не показывают
# (`core/image_convert.py`). Колесо musllinux есть — в alpine-образе не собирается.
pillow-heif = "^1.8.0"


[tool.poetry.group.dev.dependencies]
black = "^24.8.0"
flake8 = "^7.1.1"
isort = "^5.13.2"
mypy = "^1.11.1"
pytest = "^9.1.1"
pytest-asyncio = "^1.4.0"
httpx = ">=0.27"
pytest-cov = "^7.1.0"
pip-audit = "^2.10.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 88
skip-string-normalization = true
exclude = '''
/(
    \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.nox
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
  | api_v1/users/schemas.py  # Исключаем этот файл из форматирования black
)/
'''

[tool.isort]
profile = "black"
multi_line_output = 3

[tool.mypy]
# Постепенное ужесточение. Здесь — только флаги, на которых текущий код уже
# чист (проверяется в CI командой из .github/workflows/ci.yml). Следующий шаг —
# warn_return_any (13 замечаний) и disallow_untyped_defs (75 замечаний в 20
# файлах); включать их можно по мере правок. См. docs/checks.md.
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
strict_equality = true

[[tool.mypy.overrides]]
# pywebpush поставляется без стабов и маркера py.typed, а тянет за собой
# http-ece/py-vapid: свои аннотации к чужой библиотеке не пишем.
module = "pywebpush"
ignore_missing_imports = true

[tool.pytest.ini_options]
# async-тесты (pytest-asyncio) запускаются автоматически.
asyncio_mode = "auto"
testpaths = ["tests"]
# Чтобы импортировались пакеты api_v1/core из корня backend.
pythonpath = ["."]

[tool.coverage.run]
# Покрытие считаем по коду приложения; тесты и скрипты — нет.
# ВАЖНО: `main` — именно имя модуля, а не `main.py`. Путь с расширением coverage
# пытается импортировать как модуль и подтягивает приложение (main → api_v1 →
# core…), из-за чего модули загружаются ВТОРОЙ раз и тесты, которые подменяют
# настройки в `core.avatar_store` и подобных, начинают писать не туда (проверено:
# падали 7 тестов аватаров). ГРАБЛЯ: ошибка видна только под `--cov`.
source = ["core", "api_v1", "tasks", "main"]
omit = ["*/tests/*"]

[tool.coverage.report]
# Порог-храповик: не даём покрытию падать. Текущее значение (03.10.2026) — 70%,
# порог чуть ниже, чтобы случайные колебания не роняли CI. Поднимать по мере роста.
fail_under = 68
show_missing = true
skip_covered = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "pragma: no cover",
]