# Параметры сборки Android-приложения Pismo.
#
# Значения можно переопределить из командной строки:
#   ./gradlew bundleRelease -PrustoreProjectId=123456 -PpismoVersionCode=2 -PpismoVersionName=1.1.0

# Адрес веб-приложения, которое открывает обёртка.
pismoBaseUrl=https://pismo.space

# ID проекта push-уведомлений: RuStore Консоль → Push-уведомления → Проекты.
# Пустое значение = push не инициализируется (приложение работает, уведомлений нет).
rustoreProjectId=

# Версия приложения. versionCode обязательно увеличивать при каждой публикации.
pismoVersionCode=1
pismoVersionName=1.0.0

android.useAndroidX=true
android.nonTransitiveRClass=true
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
