# Сбор метрик приложения (Prometheus).
#
# Файл монтируется в контейнер (`./monitoring/prometheus:/etc/prometheus:ro`),
# правка применяется перезапуском сервиса — см. docs/monitoring.md.
#
# Вместо токена здесь стоит подстановка `__METRICS_TOKEN__`: Prometheus НЕ умеет
# разворачивать переменные окружения в конфиге, поэтому токен подставляет
# entrypoint контейнера (см. команду сервиса в docker-compose.prod.yaml).
#
# Скребём через nginx (`frontend`), а не слот web-blue/web-green напрямую: nginx
# проксирует `/api/` на АКТИВНЫЙ слот, поэтому переключение слота при деплое цель
# не меняет, а «мёртвых» целей в выдаче нет.
global:
  scrape_interval: 15s
  scrape_timeout: 10s

# Правила алертов (файлы — в monitoring/prometheus/rules/, каталог смонтирован
# рядом с этим конфигом): видны в интерфейсе Prometheus (/alerts).
rule_files:
  - /etc/prometheus/rules/*.yml

# Куда Prometheus отдаёт сработавшие алерты. Сервис `alertmanager` описан в
# docker-compose.prod.yaml, имя резолвится в общей сети проекта.
alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: pismo-app
    scheme: https
    metrics_path: /api/v1/system/metrics/
    params:
      token: ["__METRICS_TOKEN__"]
    # Внутри сети сертификат выписан на pismo.space, а обращаемся по имени
    # контейнера — сверять имя бессмысленно, канал всё равно локальный.
    tls_config:
      insecure_skip_verify: true
    static_configs:
      - targets: ["frontend:443"]
        labels:
          instance: pismo

  # Prometheus сам себя тоже собирает: видно, не отстаёт ли сбор (scrape_duration,
  # tsdb) — иначе «тишина» на графиках выглядит как затишье в приложении.
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
