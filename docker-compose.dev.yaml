# docker-compose.dev.yml
services:
  web:
    build:
      context: .
      dockerfile: ./backend/Dockerfile.dev
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required (see .env.example)}@db:5432/microshop
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:?JWT_SECRET_KEY is required (see .env.example)}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - server_network
    volumes:
      # Монтируем исходный код backend в контейнер
      - ./backend:/app
      # Не монтируем poetry.lock и pyproject.toml снова, они уже скопированы в образе для установки зависимостей
      # Но мы можем смонтировать .venv если хотим, но обычно poetry сам управляет этим в образе, а код обновляется через volume
    # Для nodemon или hot-reload в python (uvicorn --reload) команда уже указана в Dockerfile.dev

  db:
    image: postgres:18
    volumes:
      - postgres_data:/var/lib/postgresql/
      # Дамп/восстановление: при создании нового volume БД (после down -v)
      # postgres автоматически выполнит ./db_dump/*.sql (восстановление из дампа).
      - ./db_dump:/docker-entrypoint-initdb.d:ro
    environment:
      - POSTGRES_URL=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required (see .env.example)}
      - POSTGRES_DB=microshop
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d microshop"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  nginx:
    image: nginx:1.27-alpine
    build:
      context: .
      dockerfile: ./nginx/Dockerfile.dev
    ports:
      - "8080:80"
    depends_on:
      - web
    networks:
      - server_network
    volumes:
      # Монтируем собранную директорию frontend в nginx
      # Предполагается, что разработчик запускает сборку frontend (npm run build) или dev server отдельно,
      # либо использует proxy к dev server (см. ниже). Пока смонтируем dist.
      - ./frontend/dist:/usr/share/nginx/html
      # Если используется Vite dev server, то этот volume не нужен, а конфиг nginx меняется.

networks:
  server_network:
    driver: bridge

volumes:
  postgres_data: